{% extends 'base.html' %}

{% block title %}400 — Bad Request | JobFlow{% endblock %}

{% block public_content %}
<div class="container-xl py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 border-0 shadow-sm">
        <div class="display-1 fw-bold text-warning mb-2">400</div>
        <h3 class="fw-bold mb-3">Bad Request</h3>
        <p class="text-muted mb-4">The server could not understand the request due to invalid syntax or parameters.</p>
        <div>
          <a href="{{ url_for('auth.index') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i> Return Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
