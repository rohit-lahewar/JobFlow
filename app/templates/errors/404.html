{% extends 'base.html' %}

{% block title %}404 — Page Not Found | JobFlow{% endblock %}

{% block public_content %}
<div class="container-xl py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 border-0 shadow-sm">
        <div class="display-1 fw-bold text-primary mb-2">404</div>
        <h3 class="fw-bold mb-3">Page or Record Not Found</h3>
        <p class="text-muted mb-4">The application, interview, or page you are looking for does not exist or has been removed.</p>
        <div>
          <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.index') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i> Return to Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
