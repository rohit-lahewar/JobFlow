{% extends 'base.html' %}

{% block title %}403 — Forbidden | JobFlow{% endblock %}

{% block public_content %}
<div class="container-xl py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 border-0 shadow-sm">
        <div class="display-1 fw-bold text-danger mb-2">403</div>
        <h3 class="fw-bold mb-3">Access Denied</h3>
        <p class="text-muted mb-4">You do not have permission to access this resource. User data is strictly isolated.</p>
        <div>
          <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.index') }}" class="btn btn-primary">
            <i class="bi bi-shield-check me-1"></i> Return to Safe Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
