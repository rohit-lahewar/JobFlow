{% extends 'base.html' %}

{% block title %}401 — Unauthorized | JobFlow{% endblock %}

{% block public_content %}
<div class="container-xl py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 border-0 shadow-sm">
        <div class="display-1 fw-bold text-info mb-2">401</div>
        <h3 class="fw-bold mb-3">Authentication Required</h3>
        <p class="text-muted mb-4">You must be logged in to view this pipeline resource.</p>
        <div class="d-flex justify-content-center gap-2">
          <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
          </a>
          <a href="{{ url_for('auth.index') }}" class="btn btn-light border">Home</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
