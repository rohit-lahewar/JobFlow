{% extends 'base.html' %}

{% block title %}500 — Server Error | JobFlow{% endblock %}

{% block public_content %}
<div class="container-xl py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card p-5 border-0 shadow-sm">
        <div class="display-1 fw-bold text-danger mb-2">500</div>
        <h3 class="fw-bold mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">An unexpected technical error occurred. Any open database transaction has been safely rolled back.</p>
        <div>
          <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.index') }}" class="btn btn-primary">
            <i class="bi bi-arrow-repeat me-1"></i> Return to Safety
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
